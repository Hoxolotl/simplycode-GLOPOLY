<div>
  <h3>Solid Turtle debug window</h3>
  <form data-simply-command="retrievefile">
    <label>Pod URL
      <input type="url" name="solidProvider" data-simply-field="solidProvider" placeholder="https://your-pod.example/" required>
    </label>
    <label>Website name
      <input type="text" name="websiteName" data-simply-field="websiteName" value="GLOPOLY" required>
    </label>
    <button type="submit">Retrieve file</button>
  </form>
  <p role="status" data-simply-field="retrieveStatus" data-simply-content="text"></p>
</div>
