    <script>
      window.turtleCMS = {};
    
      window.turtleCMS.issuer = null;
      window.turtleCMS.client = null;
    
      window.turtleCMS.createClient = function (issuer) {
        window.turtleCMS.issuer = issuer;
    
        window.turtleCMS.client = metro.client().with(
          metro.oidc.oidcmw({
            issuer: issuer,
            client_info: {
              client_name: "Turtle CMS",
              redirect_uris: [
                window.location.origin + "/"
              ]
            }
          })
        );
        return window.turtleCMS.client;
      };
    </script>
    <!-- the-ds (baseComponent/th-ds) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/muze-nl/the-ds@main/dist/theds.css">

    <script>
      var simplyDataApi = {};
      var simplyApp = {};
      window.addEventListener("simply-content-loaded", function() {
        simply.bind = false;
        /* Raw API */
        var simplyRawApi = {
          
        };
        /* End of Raw API */
        /* Data API */
        simplyDataApi = {
          // component/Solid-Turtle
          "retrieveFile" : async function(issuer) {
            let turtleClient = await turtleCMS.createClient(issuer)
            console.log(turtleClient)
          
            let file = turtleClient.get("public/profile/card.ttl")
            console.log(file)
          }
        };
        /* End of Data API */
        simplyApp = simply.app({
          /* Actions */
          actions: {
            // component/Solid-Turtle
            "retrieveFile" : async function(issuer) {
            	await simplyDataApi.retrieveFile(issuer)
            }
          },
          /* /Actions */
          /* Commands */
          commands: {
            // component/Solid-Turtle
            "retrievefile" : async function(form, values) {
              console.log(form)
              console.log(values)
              await simplyApp.actions.retrieveFile(values.solidProvider);
            }
          },
          /* /Commands */
          /* Keyboard shortcuts */
          keyboard: {
            
          },
          /* /Keyboard shortcuts */
          /* Routes */
          routes: {
            // page/Main
            "#simplypresent/" : async function() {
             document.location.href = "https://glopoly.tech/submodules/SimplyPresent/src/generated.html";
            },
            // page/Main
            "/" : async function() {
              editor.pageData.page = 'Start'  
            }
          }
          /* /Routes */
        });
      });
      function clone(ob) {
        return JSON.parse(JSON.stringify(ob));
      }
      function updateDataSource(name) {
        document.querySelectorAll('[data-simply-data="'+name+'"]').forEach(function(list) {
          editor.list.applyDataSource(list, name);
          list.dataBindingPaused = 0;
        });
      }
    </script>
